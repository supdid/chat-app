<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pictionary</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="pictionary.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1420">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <a id="back-link" href="index.html">&larr; Back to chat</a>

  <div id="lobby">
    <div class="panel">
      <h1>🖍️ Pictionary</h1>
      <p class="tagline">Take turns drawing while everyone else guesses the word in the chat.</p>
      <p id="lobby-status" class="mode-hint">Connecting…</p>
      <h3>Players</h3>
      <ul id="lobby-players" class="player-list"></ul>
      <label for="category-select" class="mode-hint">Word category</label>
      <select id="category-select">
        <option value="Random">Random (all categories)</option>
      </select>
      <button id="start-btn" class="primary" disabled>Start round</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div id="top-bar">
      <span id="round-status">Waiting for a round to start…</span>
      <span id="round-timer"></span>
      <button id="game-start-btn" class="small-btn hidden">Start round</button>
      <button id="menu-btn-game" class="icon-btn" aria-label="Player list">👥</button>
    </div>

    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="toolbar" class="hidden">
        <div id="color-swatches"></div>
        <input id="brush-size" type="range" min="2" max="24" value="5">
        <button id="clear-btn" class="small-btn" type="button">Clear</button>
      </div>
    </div>

    <div id="feed"></div>

    <form id="guess-form" class="hidden">
      <input id="guess-input" type="text" placeholder="Type your guess…" maxlength="100" autocomplete="off">
      <button type="submit">Guess</button>
    </form>
  </div>

  <div id="players-overlay" class="hidden">
    <div class="panel">
      <div class="panel-header">
        <h2>Players</h2>
        <button id="players-close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <ul id="players-list" class="player-list"></ul>
      <button id="spectate-toggle-btn" class="small-btn" type="button">👀 Switch to watch-only</button>
      <h3>🏆 All-time leaderboard (this room)</h3>
      <ul id="leaderboard-list" class="player-list"></ul>
    </div>
  </div>

  <script src="error-report.js"></script>
  <script src="pictionary.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
