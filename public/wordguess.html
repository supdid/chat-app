<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Word Guess</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="wordguess.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1420">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <a id="back-link" href="index.html">&larr; Back to chat</a>

  <div id="lobby">
    <div class="panel">
      <h1>🟩 Word Guess</h1>
      <p class="tagline">Everyone in the room races to guess the same 5-letter word in 6 tries.</p>
      <p id="lobby-status" class="mode-hint">Connecting…</p>
      <h3>Players</h3>
      <ul id="lobby-players" class="player-list"></ul>
      <button id="start-btn" class="primary">Start round</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div id="top-bar">
      <span id="round-status">Waiting for a round to start…</span>
      <span id="guess-count"></span>
      <button id="menu-btn-game" class="icon-btn" aria-label="Player list">👥</button>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
      <div id="round-message"></div>
    </div>

    <div id="keyboard"></div>

    <button id="game-start-btn" class="primary hidden">Next word</button>
  </div>

  <div id="players-overlay" class="hidden">
    <div class="panel">
      <div class="panel-header">
        <h2>Players</h2>
        <button id="players-close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <ul id="players-list" class="player-list"></ul>
      <h3>🏆 All-time leaderboard (this room)</h3>
      <ul id="leaderboard-list" class="player-list"></ul>
    </div>
  </div>

  <script src="error-report.js"></script>
  <script src="wordguess.js"></script>
  <script src="update-prompt.js"></script>
</body>
</html>
