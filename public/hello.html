<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hello</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="hello.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1533">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <a id="back-link" href="index.html">&larr; Back to chat</a>

  <div class="moon"></div>
  <div class="hill"></div>
  <div class="village" id="village"></div>

  <div class="hud">
    <div class="hud-left">
      <div class="stat">
        <div class="label">Time</div>
        <div class="value" id="timeVal">60</div>
      </div>
      <button class="soundtoggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Mute sound">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="wave wave1" d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path class="wave wave2" d="M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path class="slash" d="M4 4 L20 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="wordmark">Hello</div>
    <div class="stat-row">
      <div class="stat">
        <div class="label">Score</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat streak">
        <div class="label">Streak</div>
        <div class="value" id="streakVal">0</div>
      </div>
    </div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="card">
      <h1>Hello</h1>
      <div class="beststart" id="bestStartLine" hidden></div>
      <p class="sub">Windows light up around the village at dusk. Tap each one before it goes dark to wave hello back. Keep your streak alive &mdash; every 5th greeting earns a bonus in another language.</p>
      <div class="btnrow">
        <button class="play" id="startBtn">Start greeting</button>
        <button class="play secondary" id="showBoardBtn" type="button">Leaderboard</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="endOverlay" hidden>
    <div class="card">
      <h1>Time's up</h1>
      <div class="result" id="finalScore">0</div>
      <div class="resultlabel">points</div>
      <div class="best" id="bestLine"></div>
      <div class="btnrow">
        <button class="play" id="againBtn">Play again</button>
        <button class="play secondary" id="endBoardBtn" type="button">Leaderboard</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="boardOverlay" hidden>
    <div class="card">
      <h1>Leaderboard</h1>
      <p class="sub small">Top scores in this room</p>
      <ol class="board" id="boardList"></ol>
      <button class="play" id="closeBoardBtn" type="button">Back</button>
    </div>
  </div>

  <script src="error-report.js"></script>
  <script src="hello.js"></script>
  <script src="update-prompt.js"></script>
</body>
</html>
