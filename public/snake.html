<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="snake.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1420">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <a id="back-link" href="index.html">&larr; Back to chat</a>

  <div id="game">
    <div id="top-bar">
      <span id="score-label">Score: 0</span>
      <span id="best-label"></span>
      <button id="menu-btn-game" class="icon-btn" aria-label="Leaderboard">🏆</button>
    </div>

    <div id="board-wrap">
      <canvas id="board" width="320" height="320"></canvas>
      <div id="start-overlay">
        <p>Use arrow keys / WASD, or swipe on mobile</p>
        <button id="start-btn" class="primary" type="button">Start</button>
      </div>
      <div id="gameover-overlay" class="hidden">
        <p id="gameover-text">Game over!</p>
        <button id="restart-btn" class="primary" type="button">Play again</button>
      </div>
    </div>

    <div id="touch-controls">
      <button id="touch-up" type="button">⬆️</button>
      <div id="touch-row">
        <button id="touch-left" type="button">⬅️</button>
        <button id="touch-down" type="button">⬇️</button>
        <button id="touch-right" type="button">➡️</button>
      </div>
    </div>
  </div>

  <div id="players-overlay" class="hidden">
    <div class="panel">
      <div class="panel-header">
        <h2>🏆 All-time leaderboard (this room)</h2>
        <button id="players-close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <ul id="leaderboard-list" class="player-list"></ul>
    </div>
  </div>

  <script src="error-report.js"></script>
  <script src="snake.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
